<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf9f5" />
    <title>Page Not Found | Doze Haven</title>

    <link rel="stylesheet" href="404.css" />
    <link rel="stylesheet" href="./main/global.css" />

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./main/main.js" defer></script>
  </head>

  <body data-root="./">
    <main class="doze-not-found">
      <nav
        class="doze-not-found__preferences"
        aria-label="Display preferences"
      >
        <button
          class="doze-not-found__toggle"
          id="darkToggle"
          type="button"
          title="Dark Mode"
          aria-label="Switch to dark mode"
        >
          <i data-lucide="moon" aria-hidden="true"></i>
        </button>

        <button
          class="doze-not-found__toggle doze-not-found__rtl-toggle"
          id="rtlToggle"
          type="button"
          title="Switch to right-to-left layout"
          aria-label="Switch to right-to-left layout"
          aria-pressed="false"
        >
          <i data-lucide="arrow-left-right" aria-hidden="true"></i>
        </button>
      </nav>

      <section
        class="doze-not-found__content"
        aria-labelledby="notFoundTitle"
      >
        <div class="doze-not-found__icon" aria-hidden="true">
          <i data-lucide="bed-double"></i>
        </div>

        <p class="doze-not-found__eyebrow">PAGE NOT FOUND</p>

        <h1 class="doze-not-found__code" aria-hidden="true">404</h1>

        <h2 class="doze-not-found__title" id="notFoundTitle">
          This page seems to
          <span>have wandered off.</span>
        </h2>

        <p class="doze-not-found__text">
          The page you are looking for may have moved, been removed, or is
          temporarily unavailable. Let’s guide you back to restful sleep.
        </p>

        <div class="doze-not-found__actions">
          <a class="btn-primary" href="./index.html">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
            Back to home
          </a>

          <a class="btn-secondary" href="./contact.html">
            Contact us
            <i data-lucide="arrow-up-right" aria-hidden="true"></i>
          </a>
        </div>

        <a class="doze-not-found__shop-link" href="./collection.html">
          Explore the collection
          <i data-lucide="arrow-right" aria-hidden="true"></i>
        </a>
      </section>

      <div
        class="doze-not-found__decoration doze-not-found__decoration--one"
        aria-hidden="true"
      ></div>

      <div
        class="doze-not-found__decoration doze-not-found__decoration--two"
        aria-hidden="true"
      ></div>
    </main>
  </body>
</html>
